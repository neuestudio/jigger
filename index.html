<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Jigger 칵테일 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F3; --surface:#FBFBFA; --ink:#17191A; --muted:#6A6F6D; --faint:#9AA09D; --line:#DCDFDC;
  --chip:#E9EBE8; --glass-edge:#C9CECA;
  --display:"Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121413; --surface:#181B1A; --ink:#ECEEEC; --muted:#9DA3A0; --faint:#6C726F; --line:#2A2E2C;
    --chip:#222624; --glass-edge:#3A3F3C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121413; --surface:#181B1A; --ink:#ECEEEC; --muted:#9DA3A0; --faint:#6C726F; --line:#2A2E2C;
  --chip:#222624; --glass-edge:#3A3F3C;
}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
.wrap{max-width:1200px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); padding-block:40px 80px}

/* header */
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 32px; padding-bottom:28px; border-bottom:1px solid var(--ink)}
.brand h1{font-family:var(--display); font-weight:400; font-size:clamp(48px,8vw,84px); line-height:.9; margin:0; letter-spacing:.01em}
.brand p{margin:12px 0 0; color:var(--muted); max-width:42ch}
.legend{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.04em; text-align:right; line-height:1.8}

/* toolbar */
.toolbar{display:grid; gap:14px; padding-block:20px; border-bottom:1px solid var(--line)}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px}
.group{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); margin-right:4px; min-width:44px}
.search{flex:1 1 260px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-block:6px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none; color:var(--faint)}
.search input{flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:15px; color:var(--ink); outline:none; padding:2px 0}
.search input::placeholder{color:var(--faint)}
.chip{appearance:none; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; cursor:pointer; transition:background .15s, color .15s, border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip:focus-visible,.search input:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px}
.seg .chip{border:0; padding:4px 11px; font-family:var(--mono); font-size:12px}
.spacer{flex:1}
.count{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); column-gap:40px}
.item{display:grid; grid-template-columns:18px 1fr; gap:20px; padding-block:28px; border-bottom:1px solid var(--line)}
.glass{position:relative; display:flex; flex-direction:column-reverse; border:1px solid var(--glass-edge); border-top:0; border-radius:0 0 3px 3px; overflow:hidden; min-height:160px; background:transparent}
.glass span{display:block; width:100%; border-top:1px solid color-mix(in srgb, var(--surface) 60%, transparent)}
.glass span:last-child{border-top:0}
.body{min-width:0; display:flex; flex-direction:column; gap:14px}
.head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.name{font-family:var(--display); font-size:34px; line-height:1; margin:0; font-weight:400; text-wrap:balance}
.kr{font-size:12.5px; color:var(--muted); margin-top:6px}
.base{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); white-space:nowrap}
.ings{list-style:none; margin:0; padding:0; display:grid; gap:3px}
.ings li{display:grid; grid-template-columns:62px 10px 1fr; align-items:baseline; gap:8px}
.amt{font-family:var(--mono); font-size:13px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.dot{width:8px; height:8px; border-radius:50%; align-self:center; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent)}
.dot.none{background:transparent; box-shadow:none}
.dot.none::before{content:""; display:block; width:8px; height:1px; margin-top:4px; background:var(--faint)}
.ing{font-size:14px}
.ing small{color:var(--faint); font-size:12px; margin-left:4px}
.meta{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:12px; padding:2px 9px; border-radius:4px; background:var(--chip); color:var(--ink); white-space:nowrap}
.tag b{font-weight:600}
.how{margin:0; color:var(--muted); font-size:13px; line-height:1.6}
.empty{padding:64px 0; color:var(--muted); text-align:center}
.empty button{margin-top:12px}
footer{margin-top:40px; font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.04em}

@media (max-width:520px){
  .legend{text-align:left}
  .name{font-size:30px}
  .label{min-width:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Jigger</h1>
      <p>클래식 칵테일 18잔. 왼쪽 막대는 잔에 채워지는 비율 — 아래부터 레시피 순서대로 쌓입니다.</p>
    </div>
    <div class="legend">1 oz = 30 ml<br>1 dash ≈ 1 ml<br>IBA 기준 레시피</div>
  </header>

  <div class="toolbar">
    <div class="row">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="칵테일 이름이나 재료로 찾기 — 예: 캄파리, lime" autocomplete="off">
      </label>
      <div class="group">
        <span class="label">단위</span>
        <div class="seg" id="unit"><button class="chip" data-v="ml" aria-pressed="true">ml</button><button class="chip" data-v="oz" aria-pressed="false">oz</button></div>
      </div>
      <div class="group">
        <span class="label">잔 수</span>
        <div class="seg" id="serve"><button class="chip" data-v="1" aria-pressed="true">×1</button><button class="chip" data-v="2" aria-pressed="false">×2</button><button class="chip" data-v="4" aria-pressed="false">×4</button></div>
      </div>
    </div>
    <div class="row">
      <div class="group" id="bases"><span class="label">베이스</span></div>
    </div>
    <div class="row">
      <div class="group" id="methods"><span class="label">기법</span></div>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
  <footer>Jigger · 지거는 바에서 쓰는 계량컵입니다. 과음하지 마세요.</footer>
</div>

<script>

   ings:[['진','Gin',60,'gin'],['드라이 베르무트','Dry Vermouth',10,'dryv'],['오렌지 비터스',null,'1 dash']],

   ings:[['버번 위스키','Bourbon',45,'whiskey'],['레몬 주스','Lemon',25,'lemon'],['심플 시럽','Syrup',20,'syrup'],['달걀 흰자 (선택)','Egg white',15,'egg']],
   how:'흰자를 쓰면 얼음 없이 먼저 드라이 셰이크, 얼음 넣고 다시 셰이크.'},
  {en:'Boulevardier', kr:'불바디에', base:'위스키', method:'Stir', glass:'올드패션드', garnish:'오렌지 필',
   ings:[['버번 위스키','Bourbon',45,'whiskey'],['캄파리','Campari',30,'campari'],['스위트 베르무트','Sweet Vermouth',30,'sweetv']],
   how:'네그로니의 진을 버번으로 바꾼 한 잔. 저어서 얼음 위로.'},
  {en:'Daiquiri', kr:'다이키리', base:'럼', method:'Shake', glass:'쿠프', garnish:'라임 휠',
   ings:[['화이트 럼','White Rum',60,'clear'],['라임 주스','Lime',25,'lime'],['심플 시럽','Syrup',15,'syrup']],
   how:'얼음과 함께 10초 강하게 셰이크, 차가운 쿠프에 더블 스트레인.'},

   ings:[['화이트 럼','White Rum',45,'clear'],['라임 주스','Lime',20,'lime'],['심플 시럽','Syrup',15,'syrup'],['소다수','Soda',60,'soda'],['민트',null,'6–8 잎']],
   how:'민트와 시럽을 가볍게 눌러 향을 내고, 크러시드 아이스·럼·라임 후 소다로 채운다.'},

   ings:[['블랑코 테킬라','Tequila',50,'clear'],['트리플 섹','Triple Sec',20,'triple'],['라임 주스','Lime',15,'lime']],

  {en:'Paloma', kr:'팔로마', base:'테킬라', method:'Build', glass:'하이볼', garnish:'자몽 슬라이스, 소금 한 꼬집',
   ings:[['블랑코 테킬라','Tequila',50,'clear'],['라임 주스','Lime',5,'lime'],['자몽 소다','Grapefruit Soda',100,'grapefruit']],
   how:'얼음 채운 잔에 테킬라와 라임, 소금 한 꼬집, 자몽 소다로 채운다.'},
  {en:'Cosmopolitan', kr:'코스모폴리탄', base:'보드카', method:'Shake', glass:'마티니', garnish:'오렌지 필',
   ings:[['시트론 보드카','Citron Vodka',40,'clear'],['트리플 섹','Triple Sec',15,'triple'],['라임 주스','Lime',15,'lime'],['크랜베리 주스','Cranberry',30,'cran']],
   how:'모두 셰이크해 차가운 마티니 잔에 거르고 오렌지 오일을 뿌린다.'},
  {en:'Moscow Mule', kr:'모스코 뮬', base:'보드카', method:'Build', glass:'코퍼 머그', garnish:'라임 웨지',
   ings:[['보드카','Vodka',45,'clear'],['라임 주스','Lime',10,'lime'],['진저 비어','Ginger Beer',120,'ginger']],

   ings:[['보드카','Vodka',50,'clear'],['커피 리큐르','Coffee Liqueur',10,'coffee'],['에스프레소','Espresso',30,'espresso']],
   how:'갓 내린 에스프레소로 아주 세게 셰이크해야 거품 층이 생긴다.'},
  {en:'Sidecar', kr:'사이드카', base:'브랜디', method:'Shake', glass:'쿠프', garnish:'설탕 림 (선택)',
   ings:[['코냑','Cognac',50,'cognac'],['트리플 섹','Triple Sec',20,'triple'],['레몬 주스','Lemon',20,'lemon']],
   how:'얼음과 셰이크해 차가운 쿠프에 거른다.'},
  {en:'Aperol Spritz', kr:'아페롤 스프리츠', base:'리큐르', method:'Build', glass:'와인 글라스', garnish:'오렌지 슬라이스',
   ings:[['프로세코','Prosecco',90,'prosecco'],['아페롤','Aperol',60,'aperol'],['소다수','Soda',30,'soda']],

];
const BASES = ['전체','진','위스키','럼','테킬라','보드카','브랜디','리큐르'];
const METHODS = [['전체','전체'],['Shake','셰이크'],['Stir','스터'],['Build','빌드']];
const S = {q:'', base:'전체', method:'전체', unit:'ml', serve:1};
try{ const u = localStorage.getItem('jigger-unit'); if(u==='oz'||u==='ml') S.unit=u; }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtOz(v){
  const whole = Math.floor(v + 1e-9), frac = v - whole;
  const opts = [[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let best = opts[0];
  for(const o of opts) if(Math.abs(frac-o[0]) < Math.abs(frac-best[0])) best = o;
  const w = best[0]===1 ? whole+1 : whole;
  if(w===0 && !best[1]) return '—';
  return (w ? w : '') + best[1] + ' oz';
}
function fmtAmt(ml){
  const v = ml * S.serve;
  if(S.unit==='oz') return fmtOz(v/30);
  return (Number.isInteger(v) ? v : v.toFixed(1)) + ' ml';
}

function chips(el, list, key){
  list.forEach(item => {
    const [v, label] = Array.isArray(item) ? item : [item, item];
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.v = v;
    b.setAttribute('aria-pressed', S[key]===v);
    b.onclick = () => { S[key]=v; el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.v===v)); render(); };
    el.appendChild(b);
  });
}
function seg(el, key, cast){
  el.querySelectorAll('.chip').forEach(b => {
    b.setAttribute('aria-pressed', String(S[key])===b.dataset.v);
    b.onclick = () => {
      S[key] = cast(b.dataset.v);
      el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x===b));
      if(key==='unit') try{ localStorage.setItem('jigger-unit', S.unit); }catch(e){}
      render();
    };
  });
}

function card(r){
  const liquids = r.ings.filter(i => typeof i[2]==='number');
  const total = liquids.reduce((a,i) => a+i[2], 0);
  const bar = liquids.map(i => `<span style="flex:${i[2]} 0 0;background:${C[i[3]]}" title="${esc(i[0])} ${Math.round(i[2]/total*100)}%"></span>`).join('');
  const rows = r.ings.map(i => {
    const liquid = typeof i[2]==='number';
    return `<li><span class="amt">${liquid ? fmtAmt(i[2]) : esc(i[2])}</span>`+
      `<span class="dot${liquid?'':' none'}" ${liquid?`style="background:${C[i[3]]}"`:''}></span>`+
      `<span class="ing">${esc(i[0])}</span></li>`;
  }).join('');
  const mk = METHODS.find(m => m[0]===r.method)[1];
  return `<article class="item">
    <div class="glass" role="img" aria-label="${esc(r.kr)} 비율">${bar}</div>
    <div class="body">
      <div class="head">
        <div><h2 class="name">${esc(r.en)}</h2><div class="kr">${esc(r.kr)}</div></div>
        <span class="base">${esc(r.base)}</span>
      </div>
      <ul class="ings">${rows}</ul>
      <div class="meta"><span class="tag"><b>${mk}</b></span><span class="tag">${esc(r.glass)}</span><span class="tag">${esc(r.garnish)}</span></div>
      <p class="how">${esc(r.how)}</p>
    </div>
  </article>`;
}

function render(){
  const q = S.q.trim().toLowerCase();
  const list = R.filter(r =>
    (S.base==='전체' || r.base===S.base) &&
    (S.method==='전체' || r.method===S.method) &&
    (!q || [r.en, r.kr, r.base, ...r.ings.flatMap(i => [i[0], i[1]||''])].join(' ').toLowerCase().includes(q))
  );
  $('#count').textContent = `${list.length} / ${R.length} 레시피`;
  $('#grid').innerHTML = list.length ? list.map(card).join('') :
    `<div class="empty" style="grid-column:1/-1">${q ? `“${esc(S.q.trim())}”에` : '이 조건에'} 맞는 칵테일이 없습니다. 다른 재료로 찾아보거나 필터를 초기화하세요.<br><button class="chip" id="reset">필터 초기화</button></div>`;
  const reset = $('#reset');
  if(reset) reset.onclick = () => {
    S.q=''; S.base='전체'; S.method='전체'; $('#q').value='';
    document.querySelectorAll('#bases .chip, #methods .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.v==='전체'));
    render();
  };
}

chips($('#bases'), BASES, 'base');
chips($('#methods'), METHODS, 'method');
seg($('#unit'), 'unit', v => v);
seg($('#serve'), 'serve', Number);
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
render();
</script>

</html>
